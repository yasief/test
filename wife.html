// ═══ LEVEL: MEMORY MATCH (flip cards, find pairs) ═══════════════════════
function renderMemory(lvl){
  const symbols = (lvl.symbols && lvl.symbols.length) ? lvl.symbols : ['❤️','🌹','💌','💕','💖','🔑'];
  const deck = [...symbols, ...symbols].sort(() => Math.random() - 0.5);

  const cardsHtml = deck.map((sym, i) => `
    <button class="memory-card" data-symbol="${escapeHtml(sym)}" data-idx="${i}" aria-label="card">
      <div class="memory-card-inner">
        <div class="memory-card-front">?</div>
        <div class="memory-card-back">${escapeHtml(sym)}</div>
      </div>
    </button>
  `).join('');

  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="memory-info">
      <span>ജോഡികൾ <strong id="memPairs">0</strong>/ ${symbols.length}</span>
      <span>നീക്കങ്ങൾ <strong id="memMoves">0</strong></span>
    </div>
    <div class="memory-grid">${cardsHtml}</div>
    <div class="feedback" id="fb">രണ്ട് കാർഡ് തിരിച്ച് ജോഡി കണ്ടെത്തൂ.</div>
    <div class="actions">
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  let flipped = [];
  let matched = 0;
  let moves = 0;
  let locked = false;

  document.querySelectorAll('.memory-card').forEach(card => {
    card.addEventListener('click', () => {
      if (locked) return;
      if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      flipped.push(card);
      sndTick();
      if (flipped.length === 2){
        moves++;
        document.getElementById('memMoves').textContent = moves;
        const [a, b] = flipped;
        if (a.dataset.symbol === b.dataset.symbol){
          a.classList.add('matched'); b.classList.add('matched');
          matched++;
          document.getElementById('memPairs').textContent = matched;
          sndHeart();
          flipped = [];
          if (matched === symbols.length){
            setTimeout(() => correct(lvl), 700);
          }
        } else {
          locked = true;
          sndBump();
          setTimeout(() => {
            a.classList.remove('flipped');
            b.classList.remove('flipped');
            flipped = [];
            locked = false;
          }, 900);
        }
      }
    });
  });
}

// ═══ LEVEL: WORD UNSCRAMBLE (rearrange letters) ═════════════════════════
function renderUnscramble(lvl){
  const word = String(lvl.word || 'MICHU').toUpperCase();
  let scrambled = word.split('').sort(() => Math.random() - 0.5);
  if (scrambled.join('') === word) scrambled = scrambled.reverse();
  if (scrambled.join('') === word) [scrambled[0], scrambled[1]] = [scrambled[1], scrambled[0]];

  const slotsHtml = word.split('').map((_, i) => `<span class="unscramble-slot" data-pos="${i}"></span>`).join('');
  const tilesHtml = scrambled.map((c, i) => `<button class="unscramble-tile" data-letter="${c}" data-idx="${i}">${c}</button>`).join('');

  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="unscramble-stage">
      <div class="unscramble-target">${slotsHtml}</div>
      <div class="unscramble-tiles">${tilesHtml}</div>
    </div>
    <div class="feedback" id="fb">ടൈൽ ടാപ്പ് ചെയ്ത് സ്ലോട്ടിൽ ഇടൂ. തെറ്റിയാൽ സ്ലോട്ടിൽ ടാപ്പ് ചെയ്ത് നീക്കം ചെയ്യൂ.</div>
    <div class="actions">
      <button class="btn btn-ghost" id="unsReset">റീസെറ്റ്</button>
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  const slots = Array.from(document.querySelectorAll('.unscramble-slot'));
  const tiles = Array.from(document.querySelectorAll('.unscramble-tile'));

  function checkWord(){
    const guess = slots.map(s => s.textContent).join('');
    if (guess.length !== word.length) return;
    if (guess === word){
      sndCorrect();
      setTimeout(() => correct(lvl), 400);
    } else {
      const fb = document.getElementById('fb');
      if (fb){ fb.textContent = 'ശരിയല്ല — ടാപ്പ് ചെയ്ത് മാറ്റി പുനഃക്രമീകരിക്കൂ.'; fb.className = 'feedback error'; }
      sndWrong();
    }
  }

  tiles.forEach(tile => {
    tile.addEventListener('click', () => {
      if (tile.classList.contains('used')) return;
      const empty = slots.find(s => !s.textContent);
      if (!empty) return;
      empty.textContent = tile.dataset.letter;
      empty.dataset.tileIdx = tile.dataset.idx;
      empty.classList.add('filled');
      tile.classList.add('used');
      sndTick();
      if (slots.every(s => s.textContent)) checkWord();
    });
  });
  slots.forEach(slot => {
    slot.addEventListener('click', () => {
      if (!slot.textContent) return;
      const tile = tiles.find(t => t.dataset.idx === slot.dataset.tileIdx);
      if (tile) tile.classList.remove('used');
      slot.textContent = '';
      slot.classList.remove('filled');
      delete slot.dataset.tileIdx;
      sndTick();
    });
  });
  document.getElementById('unsReset').addEventListener('click', () => {
    slots.forEach(s => { s.textContent = ''; s.classList.remove('filled'); delete s.dataset.tileIdx; });
    tiles.forEach(t => t.classList.remove('used'));
    const fb = document.getElementById('fb');
    if (fb){ fb.textContent = 'പുതുതായി തുടങ്ങാം!'; fb.className = 'feedback'; }
  });
}

// ═══ LEVEL: BUBBLE POP (tap floating hearts) ════════════════════════════
function renderPop(lvl){
  const target  = lvl.target     || 12;
  const totalMs = lvl.durationMs || 30000;

  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="pop-stage" id="popStage">
      <div class="pop-info">
        <span>⏱ <strong id="popTime">${Math.ceil(totalMs/1000)}</strong>s</span>
        <span>💖 <strong id="popCount">0</strong>/ ${target}</span>
      </div>
    </div>
    <div class="feedback" id="fb">വേഗത്തിൽ ടാപ്പ് ചെയ്യൂ! 💕</div>
    <div class="actions">
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  const stage    = document.getElementById('popStage');
  const countEl  = document.getElementById('popCount');
  const timeEl   = document.getElementById('popTime');
  const emojis   = ['❤️','💕','💖','💗','💌','🌹','💝'];
  let popped = 0, stopped = false, spawnTimer = null;
  const startT = Date.now();

  function tick(){
    if (stopped) return;
    const elapsed = Date.now() - startT;
    timeEl.textContent = Math.max(0, Math.ceil((totalMs - elapsed)/1000));
    if (elapsed >= totalMs){ finish(false); return; }
    requestAnimationFrame(tick);
  }
  function spawn(){
    if (stopped || !stage.isConnected) return;
    const r = stage.getBoundingClientRect();
    const b = document.createElement('button');
    b.className = 'pop-bubble';
    b.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const startX = 10 + Math.random() * Math.max(0, r.width - 60);
    b.style.left = startX + 'px';
    b.style.top = (r.height - 50) + 'px';
    stage.appendChild(b);
    const dur   = 3000 + Math.random() * 2200;
    const drift = (Math.random() - 0.5) * 90;
    const anim = b.animate([
      { transform: 'translate(0,0)' },
      { transform: `translate(${drift}px, -${r.height + 80}px)` }
    ], { duration: dur, easing: 'linear', fill: 'forwards' });
    anim.onfinish = () => { try { b.remove(); } catch(e){} };
    b.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (stopped || b.dataset.popped) return;
      b.dataset.popped = '1';
      popped++;
      countEl.textContent = popped;
      sndTick();
      try { anim.cancel(); } catch(e){}
      b.style.pointerEvents = 'none';
      b.animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.9)',opacity:0}],{duration:280,fill:'forwards'});
      setTimeout(() => { try { b.remove(); } catch(e){} }, 300);
      if (popped >= target) finish(true);
    });
    spawnTimer = setTimeout(spawn, 320 + Math.random()*380);
  }
  function finish(won){
    stopped = true;
    if (spawnTimer) clearTimeout(spawnTimer);
    if (won){ setTimeout(() => correct(lvl), 450); return; }
    const fb = document.getElementById('fb');
    if (fb){ fb.textContent = 'സമയം കഴിഞ്ഞു — ഒരിക്കൽ കൂടി!'; fb.className = 'feedback error'; }
    sndWrong();
    setTimeout(() => render(), 1400);
  }
  tick();
  spawn();
}

// ═══ LEVEL: CONNECT THE DOTS (tap 1→N in order) ═════════════════════════
function renderConnect(lvl){
  const total = lvl.total || 10;
  // Generate non-overlapping positions
  const positions = [];
  let tries = 0;
  while (positions.length < total && tries < 400){
    const x = 10 + Math.random() * 80;
    const y = 14 + Math.random() * 72;
    if (positions.every(p => Math.hypot(p.x - x, p.y - y) > 18)) positions.push({x, y});
    tries++;
  }
  while (positions.length < total){
    positions.push({ x: 15 + (positions.length % 5) * 18, y: 25 + Math.floor(positions.length / 5) * 22 });
  }

  const dotsHtml = positions.map((p, i) => `
    <button class="connect-dot" data-num="${i+1}" style="left:${p.x}%;top:${p.y}%"><span>${i+1}</span></button>
  `).join('');

  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="connect-stage" id="connectStage">
      <svg class="connect-lines" id="connectLines" preserveAspectRatio="none"></svg>
      ${dotsHtml}
      <div class="connect-status">അടുത്തത് <strong id="connectNext">1</strong></div>
    </div>
    <div class="feedback" id="fb">1 മുതൽ ${total} വരെ ക്രമത്തിൽ ടാപ്പ് ചെയ്യൂ.</div>
    <div class="actions">
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  const stage   = document.getElementById('connectStage');
  const lines   = document.getElementById('connectLines');
  const nextEl  = document.getElementById('connectNext');
  const dots    = Array.from(document.querySelectorAll('.connect-dot'));
  let next = 1;
  let lastDot = null;

  function dotCenterPct(dot){
    const sr = stage.getBoundingClientRect();
    const dr = dot.getBoundingClientRect();
    return {
      x: ((dr.left + dr.width/2) - sr.left) / sr.width * 100,
      y: ((dr.top  + dr.height/2) - sr.top)  / sr.height * 100
    };
  }
  function reset(){
    dots.forEach(d => d.classList.remove('hit'));
    lines.innerHTML = '';
    next = 1; nextEl.textContent = 1; lastDot = null;
  }

  dots.forEach(dot => {
    dot.addEventListener('pointerdown', e => {
      e.preventDefault();
      const num = parseInt(dot.dataset.num, 10);
      if (num === next){
        dot.classList.add('hit');
        sndTick();
        if (lastDot){
          const a = dotCenterPct(lastDot), b = dotCenterPct(dot);
          const line = document.createElementNS('http://www.w3.org/2000/svg','line');
          line.setAttribute('x1', a.x + '%'); line.setAttribute('y1', a.y + '%');
          line.setAttribute('x2', b.x + '%'); line.setAttribute('y2', b.y + '%');
          line.setAttribute('stroke', 'rgba(255,216,107,.7)');
          line.setAttribute('stroke-width', '2');
          line.setAttribute('stroke-linecap', 'round');
          lines.appendChild(line);
        }
        lastDot = dot;
        next++;
        nextEl.textContent = next > total ? '✓' : next;
        if (next > total){
          sndHeart();
          setTimeout(() => correct(lvl), 600);
        }
      } else {
        sndWrong();
        const fb = document.getElementById('fb');
        if (fb){ fb.textContent = 'തെറ്റി! ആദ്യം മുതൽ വീണ്ടും.'; fb.className = 'feedback error'; }
        reset();
      }
    });
  });
}

// ═══ LEVEL: QUIZ (multiple choice, one at a time) ═══════════════════════
function renderQuiz(lvl){
  const questions = (lvl.questions && lvl.questions.length) ? lvl.questions : [];
  let qIdx = 0;

  function showQuestion(){
    if (qIdx >= questions.length){
      setTimeout(() => correct(lvl), 400);
      return;
    }
    const q = questions[qIdx];
    game.innerHTML = levelShell(lvl, `
      <div class="prompt">${escapeHtml(lvl.prompt)}</div>
      <div class="quiz-stage">
        <div class="quiz-count">ചോദ്യം ${qIdx + 1} / ${questions.length}</div>
        <div class="quiz-q">${escapeHtml(q.q)}</div>
        <div class="quiz-options">
          ${q.options.map((opt, i) => `<button class="quiz-option" data-i="${i}">${escapeHtml(opt)}</button>`).join('')}
        </div>
      </div>
      <div class="feedback" id="fb">ശരിയായ ഉത്തരം തിരഞ്ഞെടുക്കൂ.</div>
      <div class="actions">
        ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
      </div>
    `);
    bindHint(); bindAskHeart();

    document.querySelectorAll('.quiz-option').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.dataset.i, 10);
        if (i === q.answer){
          btn.classList.add('correct');
          sndCorrect();
          qIdx++;
          setTimeout(showQuestion, 700);
        } else {
          btn.classList.add('wrong');
          sndWrong();
          const fb = document.getElementById('fb');
          if (fb){ fb.textContent = 'ഹി ഹി — വീണ്ടും ശ്രമിക്കൂ.'; fb.className = 'feedback error'; }
          setTimeout(() => btn.classList.remove('wrong'), 700);
        }
      });
    });
  }
  showQuestion();
}

// ═══ LEVEL: LOCK COMBINATION (turn dials) ═══════════════════════════════
function renderLock(lvl){
  const combo = (lvl.combo && lvl.combo.length) ? lvl.combo.map(n => ((n % 10) + 10) % 10) : [1, 2, 3];
  const dials = combo.map(() => 0);

  const dialsHtml = combo.map((_, i) => `
    <div class="lock-dial">
      <button class="lock-arrow lock-up"   data-dial="${i}" data-dir="1"  aria-label="ഉയർത്തൂ">▲</button>
      <div class="lock-num" id="lockNum${i}">0</div>
      <button class="lock-arrow lock-down" data-dial="${i}" data-dir="-1" aria-label="താഴ്ത്തൂ">▼</button>
    </div>
  `).join('');

  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="lock-stage">
      <div class="lock-dials" id="lockDials">${dialsHtml}</div>
    </div>
    <div class="feedback" id="fb">ഡയലുകൾ തിരിച്ച് ശരിയായ കോമ്പിനേഷൻ വയ്ക്കൂ.</div>
    <div class="actions">
      <button class="btn" id="lockTry">പരിശോധിക്കൂ</button>
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  document.querySelectorAll('.lock-arrow').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = parseInt(btn.dataset.dial, 10);
      const dir = parseInt(btn.dataset.dir, 10);
      dials[i] = (dials[i] + dir + 10) % 10;
      document.getElementById('lockNum' + i).textContent = dials[i];
      sndTick();
    });
  });
  document.getElementById('lockTry').addEventListener('click', () => {
    const dialsEl = document.getElementById('lockDials');
    if (dials.every((d, i) => d === combo[i])){
      dialsEl.classList.add('unlocked');
      sndCorrect();
      setTimeout(() => correct(lvl), 800);
    } else {
      dialsEl.classList.remove('shake');
      void dialsEl.offsetWidth; // restart animation
      dialsEl.classList.add('shake');
      sndWrong();
      const fb = document.getElementById('fb');
      if (fb){ fb.textContent = 'അല്ല — വീണ്ടും ശ്രമിക്കൂ.'; fb.className = 'feedback error'; }
      setTimeout(() => dialsEl.classList.remove('shake'), 500);
    }
  });
}

// ═══ COMMON: CORRECT / WRONG / HINT ═════════════════════════════════════
function correct(lvl){
  sndCorrect();
  confetti();
  // Show reward popup
  showReward(lvl.reward || '✨ ശരി!', () => {
    state.levelIdx++;
    state.wrongAttempts = 0;
    state.hintIdx = 0;
    if (state.levelIdx >= CONFIG.levels.length) state.finished = true;
    saveState();
    render();
  });
}
function showReward(message, onClose){
  const div = document.createElement('div');
  div.className = 'reward-popup';
  div.innerHTML = `
    <div class="reward-card">
      <div class="reward-emoji">✨</div>
      <div class="reward-msg">${escapeHtml(message)}</div>
      <button class="btn" id="rewardNext" type="button">അടുത്തത് ❤️</button>
    </div>
  `;
  document.body.appendChild(div);
  const btn = document.getElementById('rewardNext');
  let fired = false;
  function go(e){
    if (fired) return;
    fired = true;
    if (e){ e.preventDefault(); e.stopPropagation(); }
    div.remove();
    if (onClose) onClose();
  }
  // Bind both pointerdown and click — whichever fires first wins (de-duped via `fired`)
  btn.addEventListener('pointerdown', go);
  btn.addEventListener('click', go);
  // Also allow tapping the backdrop to advance, just in case
  div.addEventListener('click', (e) => { if (e.target === div) go(e); });
}
function wrong(msg){
  state.wrongAttempts++;
  state.hearts--;
  saveState();
  const lvlEl = document.getElementById('lvl');
  if (lvlEl){ lvlEl.classList.add('shake'); setTimeout(()=>lvlEl.classList.remove('shake'), 500); }
  sndWrong();
  const fb = document.getElementById('fb');
  if (fb){ fb.textContent = `${msg} ${state.hearts} ഹൃദയം ബാക്കി.`; fb.className = 'feedback error'; }
  if (state.hearts <= 0){ setTimeout(render, 900); return; }
  // Auto-show next hint after 2 wrong attempts
  const lvl = CONFIG.levels[state.levelIdx];
  if (state.wrongAttempts >= 2 && lvl.hints && state.hintIdx < lvl.hints.length){
    state.hintIdx++; saveState(); setTimeout(render, 700);
  }
}
function bindHint(){
  const h = document.getElementById('hint');
  if (h) h.addEventListener('click', () => {
    const lvl = CONFIG.levels[state.levelIdx];
    if (lvl.hints && state.hintIdx < lvl.hints.length){
      state.hintIdx++; saveState(); render();
    }
  });
}

// ═══ PASSWORD MODAL (give hearts) ═══════════════════════════════════════
function openPasswordModal(){
  // Already used all passwords?
  const remaining = CONFIG.hearts.passwords.filter(p => !state.usedPasswords.includes(p.toLowerCase()));
  const allUsed = remaining.length === 0;

  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.innerHTML = `
    <div class="modal-card">
      <h3>💌 യാസിഫിനോട് ചോദിക്കൂ</h3>
      <p>${allUsed ? escapeHtml(CONFIG.hearts.usedAllMessage) : `യാസിഫ് ഫോണിൽ പറയുന്ന രഹസ്യ വാക്ക് എഴുതൂ.<br><small>ഓരോ വാക്കും <strong>+${CONFIG.hearts.perPassword}</strong> ഹൃദയം തരും. ഓരോന്നും ഒരു തവണ മാത്രം പ്രവർത്തിക്കും.</small>`}</p>
      ${allUsed ? '' : `<input type="text" class="text-input" id="pwInput" placeholder="രഹസ്യ വാക്ക്" autocomplete="off" autocapitalize="off" spellcheck="false">`}
      <div class="modal-feedback" id="pwFb"></div>
      <div class="actions">
        ${allUsed ? '' : `<button class="btn" id="pwSubmit">വാക്ക് ഉപയോഗിക്കൂ</button>`}
        <button class="btn btn-ghost" id="pwClose">അടയ്ക്കൂ</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('pwClose').addEventListener('click', () => modal.remove());
  if (allUsed) return;

  const inp = document.getElementById('pwInput');
  const fb  = document.getElementById('pwFb');
  inp.addEventListener('input', sndType);
  inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); submitPw(); }});
  document.getElementById('pwSubmit').addEventListener('click', submitPw);
  setTimeout(() => inp.focus(), 100);

  function submitPw(){
    const v = (inp.value || '').trim().toLowerCase();
    if (!v){ fb.textContent = 'ആദ്യം എന്തെങ്കിലും എഴുതൂ.'; fb.className = 'modal-feedback error'; return; }

    // Check for secret restart keyword
    const restartWord = (CONFIG.restartKeyword || '').toLowerCase();
    if (restartWord && v === restartWord) {
      modal.remove();
      resetState();
      return;
    }

    const matchedOriginal = CONFIG.hearts.passwords.find(p => p.toLowerCase() === v);
    if (matchedOriginal){
      // Already used?
      if (state.usedPasswords.includes(v)){
        fb.textContent = 'ആ വാക്ക് ഉപയോഗിച്ചു കഴിഞ്ഞു. യാസിഫിനോട് വേറെ ചോദിക്കൂ. 📞';
        fb.className = 'modal-feedback error';
        sndWrong();
        return;
      }
      // Valid! Give hearts
      state.usedPasswords.push(v);
      state.hearts += CONFIG.hearts.perPassword;
      state.passwordWrongCount = 0;
      saveState();
      sndHeart();
      // Show 3 heart bumps
      const heartIcons = document.querySelectorAll('.heart-icon');
      heartIcons.forEach((h,i) => {
        if (i < state.hearts) { h.classList.remove('lost'); setTimeout(() => h.classList.add('bump'), i*80); }
      });
      fb.textContent = `+${CONFIG.hearts.perPassword} ഹൃദയങ്ങൾ! 💖`;
      fb.className = 'modal-feedback success';
      render(); // Update hearts in background, but keep modal open for manual close
    } else {
      // Wrong password
      state.passwordWrongCount = (state.passwordWrongCount || 0) + 1;
      saveState();
      const messages = CONFIG.hearts.wrongMessages;
      const idx = Math.min(state.passwordWrongCount - 1, messages.length - 1);
      fb.textContent = messages[idx];
      fb.className = 'modal-feedback error';
      sndWrong();
      inp.value = ''; inp.focus();
    }
  }
}

// ═══ WIN ════════════════════════════════════════════════════════════════
function renderWin(){
  game.innerHTML = `
    <div class="win">
      <div class="win-photo" style="background-image:url('${escapeHtml(CONFIG.photos.funny || CONFIG.photos.wedding)}');"></div>
      <div class="win-emoji">💖</div>
      <div class="win-title">നീ ജയിച്ചു, ${escapeHtml(CONFIG.wifeNickname || CONFIG.wifeName)}!</div>
      <div class="subtitle" style="margin-bottom:1rem">എല്ലാ ${CONFIG.levels.length} ലെവലുകളും — ഓരോ ഓർമ്മ, ഓരോ ചിരി, ഓരോ നിമിഷം.</div>
      <div class="win-msg malayalam">${escapeHtml(CONFIG.finalMessage)}</div>
      <div class="win-msg" style="margin-top:1.5rem"><em>— ${escapeHtml(CONFIG.husbandName)}</em></div>
      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
        <p style="font-size: .8rem; color: var(--dim); margin-bottom: .8rem;">വീണ്ടും കളിക്കാൻ രഹസ്യ വാക്ക് നൽകുക.</p>
        <div style="display: flex; justify-content: center; gap: .5rem; align-items: center;">
          <input type="text" class="text-input" id="restartWord" placeholder="രഹസ്യ വാക്ക്" style="margin-bottom: 0; width: 200px; font-size: .9rem;">
          <button class="btn" id="restartBtn" style="padding: .7rem 1.2rem;">തുടങ്ങൂ</button>
        </div>
      </div>
      <div class="footer">യാസിഫ് <span class="hbeat">❤</span> കൊണ്ടുണ്ടാക്കിയത്, ${escapeHtml(CONFIG.wifeNickname || CONFIG.wifeName)}-ന് വേണ്ടി</div>
    </div>
  `;
  sndWin();
  confetti(); setTimeout(confetti, 600); setTimeout(confetti, 1200); setTimeout(confetti, 1800);

  const restartBtn = document.getElementById('restartBtn');
  const restartInput = document.getElementById('restartWord');
  const secretRestartWord = (CONFIG.restartKeyword || 'AGAIN').toUpperCase();
  function checkRestart() {
    if (restartInput.value.trim().toUpperCase() === secretRestartWord) {
      resetState();
    } else {
      restartInput.classList.remove('shake'); void restartInput.offsetWidth;
      restartInput.classList.add('shake');
      sndWrong();
    }
  }
  restartBtn.addEventListener('click', checkRestart);
  restartInput.addEventListener('keydown', e => { if (e.key === 'Enter') checkRestart(); });
}

// ═══ GAME OVER ═══════════════════════════════════════════════════════════
function renderGameOver(){
  game.innerHTML = `
    <div class="gameover">
      <div class="gameover-emoji">💔</div>
      <div class="gameover-title">ഹൃദയങ്ങൾ തീർന്നു</div>
      <div class="gameover-msg">പക്ഷേ നമ്മുടെ കഥ തീർന്നില്ല.<br>എന്നെ വിളിക്കൂ — ഞാൻ കൂടുതൽ തരാം. 📞❤️</div>
      <div class="actions">
        <button class="btn" id="askMore">💌 യാസിഫിനോട് ചോദിക്കൂ</button>
      </div>
      <div class="footer">നിനക്കായി മാത്രം <span class="hbeat">❤</span> കൊണ്ടുണ്ടാക്കിയത്</div>
    </div>
  `;
  document.getElementById('askMore').addEventListener('click', () => {
    openPasswordModal();
    // After modal, the user might have hearts again; check on close
    const observer = new MutationObserver(() => {
      if (state.hearts > 0 && !document.querySelector('.modal-bg')){
        observer.disconnect();
        render();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });
  sndGameOver();
}

// ═══ KICK OFF ════════════════════════════════════════════════════════════

// Secret reset code
let secretBuffer = '';
const SECRET_CODE = 'YASIF'; // The secret word to type
document.addEventListener('keydown', (e) => {
  // Ignore if an input field is focused
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
    return;
  }
  // Append key and keep buffer at the length of the secret code
  secretBuffer = (secretBuffer + e.key.toUpperCase()).slice(-SECRET_CODE.length);

  if (secretBuffer === SECRET_CODE) {
    resetState();
    secretBuffer = ''; // Reset buffer after use
  }
});

function showLoading(){
  game.innerHTML = `
    <div style="text-align:center;padding:3rem 1rem;animation:fadeIn .4s">
      <div style="font-size:3rem;margin-bottom:1rem;animation:bounce 1.5s infinite;">💖</div>
      <div style="font-family:'Caveat',cursive;font-size:1.5rem;color:var(--w);margin-bottom:.4rem;">നമ്മുടെ കഥ സിങ്ക് ചെയ്യുന്നു...</div>
      <div style="font-size:.75rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;">DXB ➜ TRV ✈️</div>
    </div>
  `;
}
async function init(){
  if (cloudReady) {
    showLoading();
    // Race the cloud fetch against a 4-second timeout. If the cloud is unreachable
    // (rules not published, no database, offline), fall back to localStorage so the
    // game never hangs on the loading screen.
    let cloud = null;
    try {
      cloud = await Promise.race([
        loadCloud(),
        new Promise(resolve => setTimeout(() => resolve(null), 4000)),
      ]);
    } catch (e) { cloud = null; }

    if (cloud) {
      state = cloud;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
    } else {
      // Cloud empty / unreachable — push current local state up (best-effort)
      saveCloud();
    }
  }
  render();
}
init();
</script>
