<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Michu Quest — DXB to TRV ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Caveat:wght@400;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#1a0a1f; --bg2:#2d0f2e;
  --pink:#ff6fa3; --pink-soft:#ff9cc1; --gold:#ffd86b; --rose:#ff5b8b;
  --cyan:#7af7ff;
  --w:#fff5f8; --dim:rgba(255,245,248,.65); --dim2:rgba(255,245,248,.35);
  --card:rgba(255,255,255,.05); --border:rgba(255,255,255,.12);
  --shadow:0 25px 60px rgba(0,0,0,.55);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100vh;width:100%;overflow-x:hidden;}
body{
  font-family:'Outfit','Noto Sans Malayalam',sans-serif;color:var(--w);
  background:radial-gradient(ellipse at 30% 0%,#3a1238 0%,var(--bg1) 50%),
             radial-gradient(ellipse at 80% 100%,#4a1648 0%,transparent 60%),
             linear-gradient(180deg,var(--bg1),var(--bg2));
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;
  padding:2rem 1rem;position:relative;
}

.heart-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.heart-bg span{position:absolute;bottom:-50px;font-size:1.2rem;animation:floatUp 12s linear infinite;opacity:0;}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0;}10%{opacity:.3;}90%{opacity:.3;}100%{transform:translateY(-110vh) rotate(360deg);opacity:0;}}

.game{
  position:relative;z-index:1;width:100%;max-width:580px;
  background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:24px;padding:2.2rem 1.8rem;
  box-shadow:var(--shadow);
}

.header{text-align:center;margin-bottom:1.2rem;}
.tag{font-size:.65rem;letter-spacing:.4em;color:var(--pink-soft);text-transform:uppercase;margin-bottom:.5rem;}
.title{font-family:'Caveat',cursive;font-size:2.4rem;font-weight:700;line-height:1;}
.subtitle{font-size:.82rem;color:var(--dim);margin-top:.4rem;}

.progress-wrap{margin:1.2rem 0;}
.progress-info{display:flex;justify-content:space-between;align-items:center;font-size:.65rem;color:var(--dim);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.45rem;gap:.5rem;flex-wrap:wrap;}
.hearts-row{display:flex;gap:.2rem;align-items:center;}
.heart-icon{font-size:.95rem;transition:transform .3s;}
.heart-icon.lost{filter:grayscale(1);opacity:.25;}
.heart-icon.bump{animation:heartbump .4s;}
@keyframes heartbump{0%,100%{transform:scale(1);}50%{transform:scale(1.4);}}
.ask-btn{
  background:rgba(255,216,107,.12);border:1px solid rgba(255,216,107,.4);color:var(--gold);
  font-family:'Outfit',sans-serif;font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;
  padding:.3rem .7rem;border-radius:99px;cursor:pointer;transition:all .2s;
}
.ask-btn:hover{background:rgba(255,216,107,.2);transform:translateY(-1px);}
.progress-bar{height:5px;background:rgba(255,255,255,.06);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1);}

.level{animation:fadeIn .6s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.level-title{font-size:1.25rem;font-weight:700;text-align:center;margin-bottom:1rem;line-height:1.3;color:var(--w);}
.prompt{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:1rem 1.2rem;margin-bottom:1.2rem;
  font-size:.9rem;line-height:1.6;text-align:center;color:var(--w);
}

.text-input{
  width:100%;background:rgba(255,255,255,.06);border:1.5px solid var(--border);
  color:var(--w);font-family:'Outfit',sans-serif;font-size:1.05rem;font-weight:500;
  border-radius:12px;outline:none;padding:.95rem 1.1rem;text-align:center;
  letter-spacing:.05em;transition:all .25s;caret-color:var(--pink);margin-bottom:1rem;
}
.text-input:focus{border-color:var(--pink);background:rgba(255,111,163,.08);box-shadow:0 0 0 3px rgba(255,111,163,.15);}
.text-input::placeholder{color:var(--dim2);font-weight:400;}

.feedback{min-height:1.4rem;text-align:center;font-size:.85rem;margin-bottom:.8rem;color:var(--dim);transition:color .3s;line-height:1.4;}
.feedback.error{color:var(--rose);}
.feedback.success{color:var(--gold);}

.actions{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.5rem;}
.btn{
  background:linear-gradient(135deg,var(--pink),var(--rose));
  border:none;color:#fff;font-family:'Outfit',sans-serif;
  padding:.85rem 1.7rem;font-size:.85rem;font-weight:600;letter-spacing:.05em;
  border-radius:99px;cursor:pointer;transition:all .25s;
  box-shadow:0 8px 22px rgba(255,91,139,.4);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(255,91,139,.55);}
.btn:active{transform:translateY(0);}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--dim);box-shadow:none;}
.btn-ghost:hover{border-color:var(--pink);color:var(--w);background:rgba(255,255,255,.04);box-shadow:none;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important;}

.shake{animation:shake .5s;}
@keyframes shake{
  10%,90%{transform:translateX(-2px);}
  20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-8px);}
  40%,60%{transform:translateX(8px);}
}

.hint-text{
  margin-top:.8rem;padding:.75rem 1rem;
  background:rgba(255,216,107,.08);border-left:3px solid var(--gold);
  border-radius:6px;font-size:.78rem;animation:fadeIn .5s;line-height:1.5;
}

/* ─── INTRO SCREEN ─── */
.intro{text-align:center;padding:1rem 0;}
.intro-photo{
  width:180px;height:180px;border-radius:50%;
  margin:0 auto 1.2rem;
  background:#3a1238 center/cover no-repeat;
  border:4px solid var(--pink);
  box-shadow:0 0 0 3px rgba(255,111,163,.2),0 20px 50px rgba(0,0,0,.5);
  position:relative;overflow:hidden;
}
.intro-photo::before{
  content:'❤️';position:absolute;bottom:-8px;right:-8px;
  background:var(--pink);width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;
  border:3px solid var(--bg1);
}
.intro-title{font-family:'Caveat',cursive;font-size:3.2rem;line-height:1;color:var(--w);margin-bottom:.3rem;}
.intro-subtitle{font-size:.95rem;color:var(--dim);margin-bottom:2rem;}
.intro-subtitle em{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--pink);font-style:normal;}
.intro-btn{
  background:linear-gradient(135deg,var(--pink),var(--rose));
  border:none;color:#fff;font-family:'Outfit',sans-serif;
  padding:1.1rem 2.5rem;font-size:1rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  border-radius:99px;cursor:pointer;
  box-shadow:0 0 0 0 rgba(255,111,163,.5);
  animation:pulseStart 2s infinite;
  transition:transform .25s;
}
.intro-btn:hover{transform:scale(1.05);}
@keyframes pulseStart{
  0%{box-shadow:0 0 0 0 rgba(255,111,163,.7);}
  70%{box-shadow:0 0 0 20px rgba(255,111,163,0);}
  100%{box-shadow:0 0 0 0 rgba(255,111,163,0);}
}
.music-toggle{
  position:fixed;top:1rem;right:1rem;z-index:1000;
  background:rgba(0,0,0,.5);border:1px solid var(--border);color:var(--w);
  width:42px;height:42px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  backdrop-filter:blur(10px);transition:all .2s;
}
.music-toggle:hover{transform:scale(1.1);border-color:var(--pink);}
#ytPlayer{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;}

/* ─── DISTANCE GAME (Level 3) ─── */
.dist-stage{
  position:relative;width:100%;height:280px;
  background:linear-gradient(180deg,#1a0a1f,#3a1238 60%,#1a0a1f);
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:.8rem;touch-action:none;
}
.dist-route-svg{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;
}
.dist-route-svg path{
  stroke:var(--gold);stroke-width:1.3;
  stroke-dasharray:3 3;fill:none;opacity:.5;
}
.dist-from,.dist-to{
  position:absolute;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);
}
.dist-from{left:1%;}.dist-to{right:1%;}
.dist-from .city,.dist-to .city{font-size:1.6rem;}
.dist-plane{
  position:absolute;font-size:2rem;cursor:grab;user-select:none;
  filter:drop-shadow(0 4px 8px rgba(255,111,163,.6));
  transition:transform .15s;touch-action:none;z-index:5;
  left:5%;top:50%;transform:translate(-50%,-50%) rotate(15deg);
}
.dist-plane:active{cursor:grabbing;}
.dist-plane.bump{animation:planebump .35s;}
@keyframes planebump{0%,100%{filter:drop-shadow(0 4px 8px rgba(255,111,163,.6));}50%{filter:drop-shadow(0 0 20px var(--rose));transform:translate(-50%,-50%) rotate(15deg) scale(1.15);}}
.dist-obstacle{
  position:absolute;background:rgba(255,91,139,.18);border:1px solid var(--rose);
  color:var(--w);font-size:.6rem;font-weight:600;padding:.3rem .6rem;
  border-radius:99px;letter-spacing:.05em;white-space:nowrap;
  pointer-events:none;backdrop-filter:blur(4px);
}
.dist-progress{
  position:absolute;bottom:.5rem;left:50%;transform:translateX(-50%);
  font-size:.65rem;color:var(--dim);background:rgba(0,0,0,.4);
  padding:.2rem .7rem;border-radius:99px;
}

/* ─── CATCH THE BUTTON (Level 6) ─── */
.catch-stage{
  position:relative;width:100%;height:280px;
  background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:.8rem;
}
.catch-btn{
  position:absolute;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  border:none;color:#fff;font-family:'Outfit',sans-serif;
  padding:.75rem 1.3rem;font-size:.8rem;font-weight:600;
  border-radius:99px;cursor:pointer;
  box-shadow:0 8px 22px rgba(255,91,139,.5);
  transition:left .3s cubic-bezier(.5,0,.5,1.5),top .3s cubic-bezier(.5,0,.5,1.5),transform .15s;
  white-space:nowrap;
}
.catch-btn.caught{
  animation:caughtPop .5s;
  background:linear-gradient(135deg,var(--gold),#ffb84d);
  box-shadow:0 0 40px rgba(255,216,107,.7);
}
@keyframes caughtPop{0%{transform:scale(1);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
.catch-counter{
  position:absolute;top:.5rem;left:50%;transform:translateX(-50%);
  font-size:.65rem;color:var(--dim);background:rgba(0,0,0,.4);
  padding:.2rem .7rem;border-radius:99px;letter-spacing:.1em;
}

/* ─── HOLD HEART (Level 7) ─── */
.hold-stage{
  position:relative;width:100%;padding:2rem 1rem;
  display:flex;flex-direction:column;align-items:center;gap:1.2rem;
}
.hold-heart{
  width:140px;height:140px;border:none;cursor:pointer;
  font-size:6rem;background:transparent;color:var(--rose);
  filter:drop-shadow(0 0 30px rgba(255,91,139,.5));
  user-select:none;-webkit-user-select:none;touch-action:none;
  transition:transform .15s;
  animation:heartbeat 1.5s infinite;
}
.hold-heart.holding{animation:heartbeatFast .35s infinite;color:var(--gold);filter:drop-shadow(0 0 40px var(--gold));}
@keyframes heartbeat{0%,100%{transform:scale(1);}30%{transform:scale(1.08);}45%{transform:scale(1);}60%{transform:scale(1.06);}}
@keyframes heartbeatFast{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}
.hold-ring{
  width:200px;height:200px;border-radius:50%;
  background:conic-gradient(var(--gold) 0%,rgba(255,255,255,.08) 0%);
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.hold-ring::before{
  content:'';position:absolute;inset:8px;border-radius:50%;
  background:var(--bg1);
}
.hold-heart-wrap{position:relative;z-index:2;}
.hold-status{font-size:.9rem;color:var(--dim);letter-spacing:.1em;text-align:center;}
.hold-status .num{font-family:'Caveat',cursive;font-size:1.8rem;color:var(--gold);}

/* ─── SCRATCH (Level 8) ─── */
.scratch-stage{
  position:relative;width:100%;aspect-ratio:4/5;max-height:520px;
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:.8rem;background:#000;
}
.scratch-photo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#1a0a1f;
}
.scratch-overlay-text{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:1rem;
  color:var(--w);font-family:'Caveat',cursive;font-size:1.6rem;line-height:1.4;
  background:rgba(0,0,0,.5);pointer-events:none;
}
.scratch-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none;}
.scratch-prompt-overlay{
  position:absolute;top:1rem;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.6);color:var(--w);font-size:.7rem;
  padding:.4rem 1rem;border-radius:99px;letter-spacing:.1em;
  pointer-events:none;
}

/* ─── HIDDEN GLASSES (Level 9) ─── */
.hidden-stage{
  position:relative;width:100%;aspect-ratio:1/1;max-height:420px;
  background:linear-gradient(180deg,#3a2a4a,#2d1f3a);
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:.8rem;
}
.hidden-stage svg{width:100%;height:100%;}
/* Suitcase (the actual target) looks IDENTICAL to decoys — no highlight, no glow.
   She has to figure out where the glasses are hidden, no visual hints. */
.hidden-target{cursor:pointer;}
.hidden-decoy{cursor:pointer;}
.hidden-decoy.shake{animation:decoyShake .4s;}
@keyframes decoyShake{0%,100%{transform:translateX(0);}25%,75%{transform:translateX(-3px);}50%{transform:translateX(3px);}}

/* ─── MEMORY MATCH (Level 10) ─── */
.memory-info{
  display:flex;justify-content:space-around;align-items:center;
  font-size:.7rem;color:var(--dim);letter-spacing:.15em;text-transform:uppercase;
  margin-bottom:.7rem;
}
.memory-info strong{color:var(--gold);font-size:1rem;font-family:'Caveat',cursive;margin:0 .25rem;}
.memory-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-bottom:.8rem;
}
.memory-card{
  aspect-ratio:1;perspective:800px;cursor:pointer;
  background:transparent;border:none;padding:0;
}
.memory-card-inner{
  position:relative;width:100%;height:100%;
  transition:transform .55s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.memory-card.flipped .memory-card-inner{transform:rotateY(180deg);}
.memory-card-front,.memory-card-back{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  border-radius:12px;font-size:1.8rem;
}
.memory-card-front{
  background:linear-gradient(135deg,var(--pink),var(--rose));
  color:#fff;font-family:'Caveat',cursive;font-size:2rem;
  box-shadow:0 4px 12px rgba(255,91,139,.35);
}
.memory-card-back{
  background:rgba(255,255,255,.06);border:1px solid var(--border);
  transform:rotateY(180deg);
}
.memory-card.matched .memory-card-back{
  background:rgba(255,216,107,.18);border-color:var(--gold);
  box-shadow:0 0 18px rgba(255,216,107,.4);
}
.memory-card.matched .memory-card-inner{animation:matchedPulse .5s;}
@keyframes matchedPulse{0%,100%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.12);}}

/* ─── WORD UNSCRAMBLE (Level 11) ─── */
.unscramble-stage{margin-bottom:.8rem;}
.unscramble-target{
  display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;
  padding:1rem .5rem;
  background:rgba(255,255,255,.04);border:1.5px dashed var(--border);
  border-radius:12px;margin-bottom:1rem;min-height:62px;
}
.unscramble-slot{
  width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  border-bottom:2px solid var(--pink-soft);
  font-family:'Caveat',cursive;font-size:1.8rem;font-weight:700;color:var(--gold);
  cursor:pointer;transition:all .2s;
}
.unscramble-slot.filled{background:rgba(255,216,107,.08);border-bottom-color:var(--gold);}
.unscramble-slot.filled:hover{background:rgba(255,91,139,.12);}
.unscramble-tiles{
  display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;
}
.unscramble-tile{
  width:46px;height:46px;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  border:none;color:#fff;font-family:'Caveat',cursive;font-size:1.8rem;font-weight:700;
  border-radius:10px;cursor:pointer;transition:all .2s;
  box-shadow:0 4px 12px rgba(255,91,139,.35);
}
.unscramble-tile:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(255,91,139,.5);}
.unscramble-tile:active{transform:translateY(0);}
.unscramble-tile.used{visibility:hidden;}

/* ─── BUBBLE POP (Level 12) ─── */
.pop-stage{
  position:relative;width:100%;height:340px;
  background:linear-gradient(180deg,#1a0a1f 0%,#3a1238 100%);
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:.8rem;touch-action:manipulation;
}
.pop-info{
  position:absolute;top:.5rem;left:50%;transform:translateX(-50%);
  display:flex;gap:1rem;z-index:5;
  font-size:.65rem;color:var(--dim);letter-spacing:.1em;
  background:rgba(0,0,0,.45);padding:.3rem .9rem;border-radius:99px;
}
.pop-info strong{color:var(--gold);font-family:'Caveat',cursive;font-size:1rem;margin:0 .25rem;}
.pop-bubble{
  position:absolute;font-size:2rem;cursor:pointer;
  background:transparent;border:none;padding:.15rem;
  filter:drop-shadow(0 0 12px rgba(255,111,163,.5));
  user-select:none;-webkit-user-select:none;
  animation:bubbleWobble 1.5s ease-in-out infinite;
}
@keyframes bubbleWobble{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}

/* ─── CONNECT THE DOTS (Level 13) ─── */
.connect-stage{
  position:relative;width:100%;aspect-ratio:1/1;max-height:380px;
  background:radial-gradient(circle at 50% 50%,#3a1238 0%,#1a0a1f 80%);
  border:1px solid var(--border);border-radius:14px;
  overflow:hidden;margin-bottom:.8rem;
}
.connect-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.connect-dot{
  position:absolute;width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--pink),var(--rose));
  border:2px solid rgba(255,255,255,.4);
  cursor:pointer;color:#fff;
  font-family:'Caveat',cursive;font-size:1.4rem;font-weight:700;line-height:1;
  box-shadow:0 4px 14px rgba(255,91,139,.5);
  transition:all .2s;transform:translate(-50%,-50%);
  z-index:3;padding:0;
}
.connect-dot:hover{transform:translate(-50%,-50%) scale(1.12);}
.connect-dot.hit{
  background:linear-gradient(135deg,var(--gold),#ffb84d);
  color:#3a1238;border-color:#fff;
  box-shadow:0 0 22px rgba(255,216,107,.7);
}
.connect-dot span{display:block;}
.connect-status{
  position:absolute;top:.5rem;left:50%;transform:translateX(-50%);
  font-size:.65rem;color:var(--dim);background:rgba(0,0,0,.5);
  padding:.3rem .8rem;border-radius:99px;letter-spacing:.1em;z-index:4;
}
.connect-status strong{color:var(--gold);font-family:'Caveat',cursive;font-size:1.05rem;margin-left:.3rem;}

/* ─── QUIZ (Level 14) ─── */
.quiz-stage{margin-bottom:.8rem;}
.quiz-count{
  text-align:center;font-size:.65rem;color:var(--dim);
  letter-spacing:.25em;text-transform:uppercase;margin-bottom:.6rem;
}
.quiz-q{
  text-align:center;font-size:1.05rem;line-height:1.5;
  padding:1rem;margin-bottom:1rem;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
}
.quiz-options{display:flex;flex-direction:column;gap:.55rem;}
.quiz-option{
  background:rgba(255,255,255,.05);border:1.5px solid var(--border);
  color:var(--w);font-family:'Outfit','Noto Sans Malayalam',sans-serif;font-size:.95rem;
  padding:.85rem 1rem;border-radius:12px;cursor:pointer;text-align:left;
  transition:all .2s;
}
.quiz-option:hover{border-color:var(--pink);background:rgba(255,111,163,.08);transform:translateX(4px);}
.quiz-option.correct{border-color:var(--gold);background:rgba(255,216,107,.15);color:var(--gold);}
.quiz-option.wrong{border-color:var(--rose);background:rgba(255,91,139,.12);animation:shake .4s;}

/* ─── LOCK COMBINATION (Level 15) ─── */
.lock-stage{
  padding:1.2rem;
  background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:14px;
  margin-bottom:.8rem;
}
.lock-dials{
  display:flex;gap:.6rem;justify-content:center;
}
.lock-dials.shake{animation:shake .5s;}
.lock-dials.unlocked .lock-num{
  color:var(--gold);background:rgba(255,216,107,.15);
  box-shadow:0 0 25px rgba(255,216,107,.5);
}
.lock-dial{
  display:flex;flex-direction:column;align-items:center;gap:.4rem;
}
.lock-arrow{
  width:54px;height:32px;
  background:rgba(255,255,255,.06);border:1px solid var(--border);

}
.lock-arrow:hover{background:rgba(255,111,163,.18);color:var(--w);}
.lock-arrow:active{transform:scale(.95);}

/* ─── PASSWORD MODAL ─── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);
  z-index:9999;display:flex;align-items:center;justify-content:center;padding:1rem;

}

}
.modal-card h3{font-family:'Caveat',cursive;font-size:1.8rem;color:var(--gold);margin-bottom:.6rem;}
.modal-card p{font-size:.85rem;color:var(--dim);margin-bottom:1rem;line-height:1.5;}
.modal-card .text-input{margin-bottom:.8rem;}
.modal-feedback{min-height:1.4rem;font-size:.85rem;margin-bottom:1rem;color:var(--dim);}
.modal-feedback.error{color:var(--rose);}
.modal-feedback.success{color:var(--gold);}

/* ─── REWARD POPUP ─── */
.reward-popup{
  position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  z-index:8000;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  animation:fadeIn .35s;
}
.reward-card{
  background:linear-gradient(145deg,#3a1238,#1a0a1f);
  border:1px solid var(--gold);border-radius:18px;padding:2rem 1.5rem;

}
.reward-emoji{font-size:3rem;margin-bottom:.8rem;animation:bounce 1.5s infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}

/* ─── WIN ─── */
.win{text-align:center;animation:winFade 1s;}
@keyframes winFade{from{opacity:0;transform:scale(.9);}to{opacity:1;transform:none;}}
.win-photo{

}
.win-emoji{font-size:3rem;margin-bottom:.8rem;animation:bounce 1.5s infinite;}
.win-title{font-family:'Caveat',cursive;font-size:2.6rem;color:var(--gold);line-height:1;margin-bottom:.3rem;}
.win-msg{font-size:1rem;line-height:1.7;margin:1.2rem 0;white-space:pre-line;}
.win-msg em{font-family:'Caveat',cursive;font-size:1.4rem;color:var(--pink);font-style:normal;}

/* ─── GAME OVER ─── */
.gameover{text-align:center;}
.gameover-emoji{font-size:3.5rem;margin-bottom:.8rem;}

.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:1000;pointer-events:none;}

.footer{text-align:center;font-size:.6rem;color:var(--dim2);margin-top:1.5rem;letter-spacing:.15em;text-transform:uppercase;}
.footer .hbeat{color:var(--pink);animation:pulse 1.2s infinite;display:inline-block;}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}

@media(max-width:480px){
  body{padding:1rem .8rem;}
  .game{padding:1.6rem 1.2rem;border-radius:18px;}
  .title{font-size:2rem;}
  .level-title{font-size:1.1rem;}
  .prompt{font-size:.82rem;padding:.85rem 1rem;}
  .btn{padding:.75rem 1.4rem;font-size:.78rem;}
  .intro-photo{width:150px;height:150px;}
  .intro-title{font-size:2.6rem;}
  .intro-subtitle{font-size:.85rem;}
  .intro-btn{padding:1rem 2rem;font-size:.88rem;}
  .hold-heart{font-size:5rem;width:120px;height:120px;}
  .hold-ring{width:170px;height:170px;}
  .dist-stage{height:240px;}
  .catch-stage{height:240px;}
  .win-photo{width:160px;height:160px;}
}
</style>
</head>
<body>

<div class="heart-bg" id="heartBg"></div>

<!-- Hidden YouTube player (autoplay starts on Start button click) -->
<div id="ytPlayer"></div>
<button class="music-toggle" id="musicToggle" title="സംഗീതം ഓൺ/ഓഫ്" aria-label="സംഗീതം ഓൺ/ഓഫ്" hidden>🔊</button>

<div class="game" id="game">
  <!-- injected by JS -->
</div>

<!-- ❤️ Edit your dates / clues / message in wife-config.js (NOT this file) -->
<script src="wife-config.js"></script>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script type="module">
/* ═════════════════════════════════════════════════════════════════════════
   GAME LOGIC — DO NOT EDIT (edit wife-config.js instead)
═════════════════════════════════════════════════════════════════════════ */

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

if (!window.CONFIG) {
  document.getElementById('game').innerHTML =
    '<div style="text-align:center;padding:2rem;color:#ff5b8b">' +
    '<h2>⚠️ Config കണ്ടെത്തിയില്ല</h2>' +
    '<p style="margin-top:1rem;color:#fff5f8"><code>wife-config.js</code> ഇതേ ഫോൾഡറിൽ ഉണ്ടെന്ന് ഉറപ്പാക്കൂ.</p></div>';
  throw new Error('wife-config.js missing');
}
const CONFIG = window.CONFIG;
const game = document.getElementById('game');

// ═══ FIREBASE (cloud sync) ═══════════════════════════════════════════════
let cloudReady = false;
let gameDocRef = null;
try {
  if (CONFIG.firebase && CONFIG.firebase.apiKey) {
    const fbApp = initializeApp(CONFIG.firebase);
    const db = getFirestore(fbApp);
    gameDocRef = doc(db, 'michu_game', 'state');
    cloudReady = true;
  }
} catch (e) { /* offline / config missing — gracefully degrade to localStorage */ }

// ═══ STATE ═══════════════════════════════════════════════════════════════
const STATE_VERSION = 2;
const STORAGE_KEY = 'michuQuest_v' + STATE_VERSION + '_' + CONFIG.wifeName.replace(/\s+/g,'_');

function defaultState(){
  return {
    started: false,
    levelIdx: 0,
    hearts: CONFIG.startingHearts,
    wrongAttempts: 0,
    hintIdx: 0,
    totalLevels: CONFIG.levels.length,
    finished: false,
    usedPasswords: [],
    passwordWrongCount: 0,
    musicMuted: false,
  };
}
function loadLocal(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw){
      const p = JSON.parse(raw);
      if (p.totalLevels === CONFIG.levels.length) return p;
    }
  } catch(e){}
  return defaultState();
}
async function loadCloud(){
  if (!cloudReady) return null;
  try {
    const snap = await getDoc(gameDocRef);
    if (snap.exists()){
      const d = snap.data();
      if (d.totalLevels === CONFIG.levels.length){
        return {
          started: !!d.started,
          levelIdx: d.levelIdx || 0,
          hearts: (typeof d.hearts === 'number') ? d.hearts : CONFIG.startingHearts,
          wrongAttempts: d.wrongAttempts || 0,
          hintIdx: d.hintIdx || 0,
          totalLevels: d.totalLevels,
          finished: !!d.finished,
          usedPasswords: Array.isArray(d.usedPasswords) ? d.usedPasswords : [],
          passwordWrongCount: d.passwordWrongCount || 0,
          musicMuted: !!d.musicMuted,
        };
      }
    }
  } catch(e){ /* offline / rules — fall back */ }
  return null;
}
let cloudSaveTimer = null;
async function saveCloud(){
  if (!cloudReady) return;
  if (cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async () => {
    try {
      await setDoc(gameDocRef, {
        ...state,
        version: STATE_VERSION,
        updatedAt: serverTimestamp(),
      });
    } catch(e){ /* silent — localStorage still has it */ }
  }, 500);
}

let state = loadLocal();    // instant local state; cloud overrides on init()

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
  saveCloud();
}
async function resetState(){
  localStorage.removeItem(STORAGE_KEY); // Clear local progress
  state = defaultState(); // Reset to initial state
  // immediate cloud reset (skip debounce)
  if (cloudReady) {
    try { await setDoc(gameDocRef, { ...state, version: STATE_VERSION, updatedAt: serverTimestamp() }); } catch(e){}
  }
  saveState(); // Save the fresh state
  render();
}

// ═══ BACKGROUND HEARTS ═══════════════════════════════════════════════════
function spawnBgHearts(){
  const bg = document.getElementById('heartBg');
  const hearts = ['❤','💗','💕','💖','🌹','✨','💌'];
  for (let i = 0; i < 18; i++){
    const s = document.createElement('span');
    s.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.fontSize = (0.8 + Math.random()*1.4) + 'rem';
    s.style.animationDuration = (8 + Math.random()*10) + 's';
    s.style.animationDelay = (Math.random()*12) + 's';
    bg.appendChild(s);
  }
}
spawnBgHearts();

// ═══ SOUND (soft chimes) ═════════════════════════════════════════════════
let audioCtx = null, masterGain = null;
function getCtx(){
  if (!audioCtx){
    const C = window.AudioContext || window.webkitAudioContext;
    if (C){ audioCtx = new C(); masterGain = audioCtx.createGain(); masterGain.gain.value = 0.4; masterGain.connect(audioCtx.destination); }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
const NOTES = { C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880.00, C6:1046.50, E6:1318.51, G6:1567.98 };
function note({freq, dur=0.4, vol=0.18, delay=0, type='sine'}){
  const ctx = getCtx(); if (!ctx) return;
  const t0 = ctx.currentTime + delay;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0+0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(masterGain);
  o.start(t0); o.stop(t0+dur+0.05);
}
function chime(freq, dur=0.5, vol=0.18, delay=0){ note({freq,dur,vol,delay}); note({freq:freq*2,dur:dur*0.7,vol:vol*0.35,delay}); }
function sndCorrect(){ chime(NOTES.G5,0.4,0.16); chime(NOTES.C6,0.5,0.13,0.08); chime(NOTES.E6,0.6,0.12,0.16); }
function sndWrong(){ note({freq:NOTES.C5*0.5, dur:0.45, vol:0.10}); }
function sndType(){ note({freq:NOTES.G5, dur:0.06, vol:0.04}); }
function sndTick(){ note({freq:NOTES.A5, dur:0.05, vol:0.05}); }
function sndHeart(){ chime(NOTES.E5,0.3,0.14); chime(NOTES.G5,0.35,0.13,0.06); }
function sndWin(){
  chime(NOTES.C5,0.4,0.18); chime(NOTES.E5,0.4,0.18,0.12);
  chime(NOTES.G5,0.4,0.18,0.24); chime(NOTES.C6,0.7,0.20,0.36);
  note({freq:NOTES.E6,dur:1.0,vol:0.13,delay:0.5});
  note({freq:NOTES.G6,dur:1.0,vol:0.11,delay:0.5});
}
function sndGameOver(){ chime(NOTES.E5,0.5,0.13); chime(NOTES.C5,0.7,0.12,0.2); }
function sndBump(){ note({freq:NOTES.C5*0.7, dur:0.15, vol:0.10, type:'triangle'}); }

// ═══ CONFETTI ═══════════════════════════════════════════════════════════
function confetti(){
  const colors = ['#ff6fa3','#ffd86b','#ff5b8b','#ff9cc1','#fff5f8','#ffb84d'];
  for (let i = 0; i < 90; i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random()*100) + 'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    c.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
    document.body.appendChild(c);
    const fall = c.animate([
      { transform: 'translate(0,0) rotate(0)', opacity: 1 },
      { transform: `translate(${(Math.random()-0.5)*400}px, 110vh) rotate(${Math.random()*1080}deg)`, opacity: 0 }
    ], { duration: 2500 + Math.random()*1500, easing: 'cubic-bezier(.2,.6,.4,1)' });
    fall.onfinish = () => c.remove();
  }
}

// ═══ YOUTUBE PLAYER ═════════════════════════════════════════════════════
let ytPlayer = null;
window.onYouTubeIframeAPIReady = function(){
  ytPlayer = new YT.Player('ytPlayer', {
    height: '0', width: '0',
    videoId: CONFIG.song.youtubeId,
    playerVars: { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, loop: 1, playlist: CONFIG.song.youtubeId },
    events: { onReady: () => { if (state.musicMuted && ytPlayer.mute) ytPlayer.mute(); } }
  });
};
function startMusic(){
  if (!ytPlayer || !ytPlayer.playVideo) return;
  try {
    ytPlayer.playVideo();
    document.getElementById('musicToggle').hidden = false;
  } catch(e){}
}
function toggleMusic(){
  if (!ytPlayer) return;
  state.musicMuted = !state.musicMuted; saveState();
  const btn = document.getElementById('musicToggle');
  if (state.musicMuted){ ytPlayer.mute(); btn.textContent = '🔇'; }
  else { ytPlayer.unMute(); btn.textContent = '🔊'; }
}
document.getElementById('musicToggle').addEventListener('click', toggleMusic);

// ═══ COMMON UI ═══════════════════════════════════════════════════════════
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function renderHearts(){
  let html = '';
  const total = Math.max(CONFIG.startingHearts, state.hearts);
  for (let i = 0; i < total; i++){
    html += `<span class="heart-icon ${i >= state.hearts ? 'lost' : ''}">❤️</span>`;
  }
  return html;
}
function levelShell(lvl, body){
  const pct = (state.levelIdx / CONFIG.levels.length) * 100;
  return `
    <div class="header">
      <div class="tag">${escapeHtml(CONFIG.wifeNickname || CONFIG.wifeName)}-ന് വേണ്ടി</div>
      <div class="title">The Michu Quest</div>
      <div class="subtitle">DXB ✈️ TRV — ഒരു ദൂര പ്രണയ ഗെയിം</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-info">
        <span>ലെവൽ ${state.levelIdx + 1} / ${CONFIG.levels.length}</span>
        <button class="ask-btn" id="askHeartBtn">💌 യാസിഫിനോട് ചോദിക്കൂ</button>
        <span class="hearts-row">${renderHearts()}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="level" id="lvl">
      <div class="level-title">${escapeHtml(lvl.title)}</div>
      ${body}
      ${renderHints(lvl)}
      <div class="footer">നിനക്കായി മാത്രം <span class="hbeat">❤</span> കൊണ്ടുണ്ടാക്കിയത്, ${escapeHtml(CONFIG.wifeNickname || CONFIG.wifeName)}</div>
    </div>
  `;
}
function renderHints(lvl){
  if (!lvl.hints || state.hintIdx === 0) return '';
  let html = '';
  for (let i = 0; i < Math.min(state.hintIdx, lvl.hints.length); i++){
    html += `<div class="hint-text">💡 ${escapeHtml(lvl.hints[i])}</div>`;
  }
  return html;
}
function bindAskHeart(){
  const b = document.getElementById('askHeartBtn');
  if (b) b.addEventListener('click', openPasswordModal);
}

// ═══ MAIN ROUTER ═════════════════════════════════════════════════════════
function render(){
  if (!state.started) return renderIntro();
  if (state.finished) return renderWin();
  if (state.hearts <= 0) return renderGameOver();
  const lvl = CONFIG.levels[state.levelIdx];
  switch (lvl.type){
    case 'text':       return renderText(lvl);
    case 'number':     return renderNumber(lvl);
    case 'distance':   return renderDistance(lvl);
    case 'catch':      return renderCatch(lvl);
    case 'hold':       return renderHold(lvl);
    case 'scratch':    return renderScratch(lvl);
    case 'hidden':     return renderHidden(lvl);
    case 'memory':     return renderMemory(lvl);
    case 'unscramble': return renderUnscramble(lvl);
    case 'pop':        return renderPop(lvl);
    case 'connect':    return renderConnect(lvl);
    case 'quiz':       return renderQuiz(lvl);
    case 'lock':       return renderLock(lvl);
    default:           game.innerHTML = '<p>അജ്ഞാത ലെവൽ: ' + lvl.type + '</p>';
  }
}

// ═══ INTRO ═══════════════════════════════════════════════════════════════
function renderIntro(){
  game.innerHTML = `
    <div class="intro">
      <div class="intro-photo" style="background-image:url('${escapeHtml(CONFIG.photos.wedding)}');"></div>
      <div class="intro-title">The Michu Quest</div>
      <div class="intro-subtitle"><em>DXB</em> ൽ നിന്ന് <em>TRV</em> ലേക്ക് ഒരു പ്രണയ കഥ<br>${CONFIG.levels.length} ലെവൽ. ${CONFIG.startingHearts} ഹൃദയം. ഒരേയൊരു എന്നേക്കും.</div>
      <button class="intro-btn" id="startBtn">നമ്മുടെ യാത്ര തുടങ്ങാം ❤️</button>
      <div class="footer">യാസിഫ് <span class="hbeat">❤</span> കൊണ്ടുണ്ടാക്കിയത്</div>
    </div>
  `;
  document.getElementById('startBtn').addEventListener('click', () => {
    getCtx();           // unlock audio context on user gesture
    startMusic();       // start YouTube song
    state.started = true; saveState();
    render();
  });
}

// ═══ LEVEL: TEXT (anniyan, snoring, kundi) ═══════════════════════════════
function renderText(lvl){
  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <input type="text" class="text-input" id="ans" placeholder="ഉത്തരം" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="feedback" id="fb">${state.wrongAttempts > 0 ? `${state.wrongAttempts} തെറ്റായ ശ്രമം` : 'നിന്റെ ഉത്തരം താഴെ എഴുതൂ.'}</div>
    <div class="actions">
      <button class="btn" id="submit">തുറക്കൂ</button>
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  const inp = document.getElementById('ans');
  inp.addEventListener('input', sndType);
  inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); checkText(lvl); }});
  document.getElementById('submit').addEventListener('click', () => checkText(lvl));
  bindHint(); bindAskHeart();
  setTimeout(() => inp.focus(), 100);
}
function normalize(s){ return String(s).toLowerCase().replace(/[^a-z0-9 ]+/g,'').replace(/\s+/g,' ').trim(); }
function checkText(lvl){
  const v = normalize(document.getElementById('ans').value);
  // Support either lvl.answer (single) or lvl.answers (array of accepted synonyms)
  const targets = (lvl.answers && lvl.answers.length)
    ? lvl.answers.map(normalize)
    : [normalize(lvl.answer)];
  const matched = targets.some(t => {
    if (!t) return false;
    if (v === t) return true;
    if (v.includes(t)) return true;
    if (t.includes(v) && v.length >= Math.max(3, t.length-2)) return true;
    return false;
  });
  if (matched) correct(lvl);
  else wrong('ശരിയല്ല — വീണ്ടും ശ്രമിക്കൂ.');
}

// ═══ LEVEL: NUMBER (days apart) ═══════════════════════════════════════════
function daysSince(dateStr){
  try {
    const t = new Date(dateStr);
    const diffMs = Date.now() - t.getTime();
    return Math.max(0, Math.floor(diffMs / (1000*60*60*24)));
  } catch(e) { return null; }
}
function renderNumber(lvl){
  // If lvl.answer is provided (e.g. "years together"), use it.
  // Otherwise compute live: days since CONFIG.lastMetDate.
  const correct = (typeof lvl.answer === 'number')
    ? lvl.answer
    : (daysSince(CONFIG.lastMetDate) || CONFIG.daysApartFallback);
  // store the computed answer on the level for checking
  lvl._answer = correct;
  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <input type="number" class="text-input" id="ans" placeholder="ഒരു സംഖ്യ" inputmode="numeric" autocomplete="off">
    <div class="feedback" id="fb">${state.wrongAttempts > 0 ? `${state.wrongAttempts} തെറ്റായ ശ്രമം` : 'ഒരു സംഖ്യ മാത്രം.'}</div>
    <div class="actions">
      <button class="btn" id="submit">തുറക്കൂ</button>
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  const inp = document.getElementById('ans');
  inp.addEventListener('input', sndType);
  inp.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); checkNumber(lvl); }});
  document.getElementById('submit').addEventListener('click', () => checkNumber(lvl));
  bindHint(); bindAskHeart();
  setTimeout(() => inp.focus(), 100);
}
function checkNumber(lvl){
  const v = parseInt(document.getElementById('ans').value, 10);
  // Per-level tolerance (used by "years together"); falls back to global setting,
  // then to 2 if neither is provided.
  const tol = (typeof lvl.tolerance === 'number')
    ? lvl.tolerance
    : (CONFIG.daysApartTolerance || 2);
  if (!isNaN(v) && Math.abs(v - lvl._answer) <= tol) correct(lvl);
  else wrong('അടുത്ത് വന്നു, പക്ഷേ ശരിയല്ല.');
}

// ═══ LEVEL: DISTANCE DRAG (DXB → TRV) ════════════════════════════════════
function renderDistance(lvl){
  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="dist-stage" id="distStage">
      <svg class="dist-route-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <!-- Wavy flight path: gentle S-curve from DXB (left) to TRV (right) -->
        <path d="M 5 50 Q 20 18, 35 50 T 65 50 T 95 50" />
      </svg>
      <div class="dist-from"><span class="city">🏙️</span><span>DXB</span></div>
      <div class="dist-to"><span class="city">🌴</span><span>TRV</span></div>
      <div class="dist-plane" id="plane">✈️</div>
      <div class="dist-progress" id="distProg">0%</div>
    </div>
    <div class="feedback" id="fb">വിമാനം തിരുവനന്തപുരം വരെ വലിച്ച് കൊണ്ടു പോകൂ.</div>
    <div class="actions">
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  const stage = document.getElementById('distStage');
  const plane = document.getElementById('plane');
  const prog = document.getElementById('distProg');
  const stageRect = () => stage.getBoundingClientRect();

  // Spawn obstacles
  const obstacles = [];
  function spawnObstacle(){
    if (!stage.isConnected) return;
    const r = stageRect();
    const o = document.createElement('div');
    o.className = 'dist-obstacle';
    o.textContent = lvl.obstacles[Math.floor(Math.random()*lvl.obstacles.length)];
    const fromTop = Math.random() < 0.5;
    const startY = fromTop ? -30 : r.height + 30;
    const endY   = fromTop ? r.height + 30 : -30;
    const x = 80 + Math.random() * (r.width - 220);
    o.style.left = x + 'px';
    o.style.top  = startY + 'px';
    stage.appendChild(o);
    const dur = 5000 + Math.random() * 4000;
    const anim = o.animate([{top: startY+'px'},{top: endY+'px'}], { duration: dur, easing: 'linear' });
    obstacles.push({ el: o, anim });
    anim.onfinish = () => { o.remove(); obstacles.splice(obstacles.indexOf(obstacles.find(x=>x.el===o)),1); };
    setTimeout(spawnObstacle, 800 + Math.random()*1200);
  }
  spawnObstacle();

  // Drag plane
  let dragging = false;
  let planeX = 0.05, planeY = 0.5;   // normalised coords
  // Sample points the plane must visit (X positions along the wavy path) so she
  // actually has to FOLLOW the curve and can't fly straight across.
  const waypoints = [0.20, 0.40, 0.60, 0.80];
  const visited = new Array(waypoints.length).fill(false);
  // Compute the Y of the wavy path at a given X (must match the SVG path d="..." curve)
  // Path: M 5,50  Q 20,18 35,50  T 65,50  T 95,50  → three half-sine arches
  function pathYAt(x){
    // Normalize to 0..1 across the visible path range (5%..95%)
    const t = Math.max(0, Math.min(1, (x - 0.05) / 0.90));
    // Three peaks/valleys: gentle sine wave with amplitude ~0.18
    return 0.5 - Math.sin(t * Math.PI * 3) * 0.18;
  }
  function setPlanePos(){
    const r = stageRect();
    plane.style.left = (planeX * r.width) + 'px';
    plane.style.top  = (planeY * r.height) + 'px';

    // Tilt plane based on direction relative to the path Y
    const dy = planeY - pathYAt(planeX);
    plane.style.transform = `translate(-50%,-50%) rotate(${15 + dy * 30}deg)`;

    // Mark waypoints as visited if she's close enough to the path
    waypoints.forEach((wp,i) => {
      if (!visited[i] && Math.abs(planeX - wp) < 0.05 && Math.abs(planeY - pathYAt(wp)) < 0.18) {
        visited[i] = true;
      }
    });

    // Progress = % of journey from 5% to 92% (so 100% appears at win point)
    const journey = Math.max(0, Math.min(100, Math.round((planeX - 0.05) / 0.87 * 100)));
    prog.textContent = journey + '%';

    // Win condition: reached the right edge AND visited all waypoints (followed the path)
    if (planeX >= 0.92){
      const allVisited = visited.every(Boolean);
      if (allVisited) {
        stopAll();
        setTimeout(() => correct(lvl), 300);
      } else {
        // Bumped to the edge without following the curve — give feedback
        const fb = document.getElementById('fb');
        if (fb && fb.textContent.indexOf('വക്രരേഖ') === -1){
          fb.textContent = 'വക്രരേഖ പിന്തുടരൂ! ഒരു ഇടം വിട്ടു പോയി.';
          fb.className = 'feedback error';
        }
      }
    }
  }
  setPlanePos();

  function pointerDown(e){ dragging = true; e.preventDefault(); }
  function pointerMove(e){
    if (!dragging) return;
    if (!stage.isConnected) { cleanupListeners(); return; }
    const r = stageRect();
    const pt = e.touches ? e.touches[0] : e;
    let x = (pt.clientX - r.left) / r.width;
    let y = (pt.clientY - r.top) / r.height;
    planeX = Math.max(0.02, Math.min(0.98, x));
    planeY = Math.max(0.08, Math.min(0.92, y));
    setPlanePos();
    checkCollision();
  }
  function pointerUp(){ dragging = false; }

  let stopped = false;
  function stopAll(){
    stopped = true;
    obstacles.forEach(o => { try{o.anim.cancel();}catch(e){} o.el.remove(); });
    obstacles.length = 0;
    cleanupListeners();
  }
  function cleanupListeners(){
    document.removeEventListener('pointermove', pointerMove);
    document.removeEventListener('pointerup', pointerUp);
    document.removeEventListener('touchmove', pointerMove);
    document.removeEventListener('touchend', pointerUp);
  }

  function checkCollision(){
    if (stopped) return;
    const planeR = plane.getBoundingClientRect();
    const px = planeR.left + planeR.width/2;
    const py = planeR.top + planeR.height/2;
    for (const ob of obstacles){
      const r = ob.el.getBoundingClientRect();
      if (px > r.left && px < r.right && py > r.top && py < r.bottom){
        // hit!
        sndBump();
        plane.classList.add('bump');
        setTimeout(() => plane.classList.remove('bump'), 400);
        // bump plane backwards a bit
        planeX = Math.max(0.02, planeX - 0.08);
        setPlanePos();
        // small heart loss
        state.hearts = Math.max(0, state.hearts - 1);
        saveState();
        const fb = document.getElementById('fb');
        if (fb){ fb.textContent = `അയ്യോ — ${ob.el.textContent}! ${state.hearts} ഹൃദയം ബാക്കി.`; fb.className = 'feedback error'; }
        const heartIcons = document.querySelectorAll('.heart-icon');
        if (heartIcons[state.hearts]) heartIcons[state.hearts].classList.add('lost');
        if (state.hearts <= 0){ stopAll(); setTimeout(render, 800); }
        // Cooldown so one obstacle doesn't drain multiple hearts in same hit
        ob.el.style.opacity = '.3';
        setTimeout(() => { try { ob.el.remove(); } catch(e){} }, 500);
        return;
      }
    }
  }

  plane.addEventListener('pointerdown', pointerDown);
  document.addEventListener('pointermove', pointerMove);
  document.addEventListener('pointerup', pointerUp);
  // Touch fallbacks
  plane.addEventListener('touchstart', pointerDown, {passive:false});
  document.addEventListener('touchmove', pointerMove, {passive:false});
  document.addEventListener('touchend', pointerUp);
}

// ═══ LEVEL: HOLD HEART ═══════════════════════════════════════════════════
function renderHold(lvl){
  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="hold-stage">
      <div class="hold-ring" id="holdRing">
        <div class="hold-heart-wrap">
          <button class="hold-heart" id="holdHeart" aria-label="ഹൃദയം പിടിക്കൂ">❤</button>
        </div>
      </div>
      <div class="hold-status" id="holdStatus"><span class="num">${lvl.durationMs/1000}s</span> അമർത്തി പിടിക്കൂ</div>
    </div>
    <div class="feedback" id="fb">വിരൽ പൊക്കരുത്. ❤️</div>
    <div class="actions">
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  const heart = document.getElementById('holdHeart');
  const ring  = document.getElementById('holdRing');
  const status= document.getElementById('holdStatus');
  let holding = false;
  let startT = 0;
  let raf = 0;

  function tick(){
    if (!holding) return;
    const elapsed = Date.now() - startT;
    const pct = Math.min(100, (elapsed / lvl.durationMs) * 100);
    ring.style.background = `conic-gradient(var(--gold) ${pct}%, rgba(255,255,255,.08) ${pct}%)`;
    const remain = Math.max(0, (lvl.durationMs - elapsed)/1000).toFixed(1);
    status.innerHTML = `പിടിച്ചിരിക്കുന്നു... <span class="num">${remain}s</span>`;
    if (Math.floor(elapsed/500) !== Math.floor((elapsed-16)/500)) sndTick();
    if (pct >= 100){
      holding = false;
      heart.classList.remove('holding');
      setTimeout(() => correct(lvl), 200);
      return;
    }
    raf = requestAnimationFrame(tick);
  }
  function startHold(e){
    e.preventDefault();
    if (holding) return;
    holding = true;
    startT = Date.now();
    heart.classList.add('holding');
    raf = requestAnimationFrame(tick);
  }
  function endHold(){
    if (!holding) return;
    holding = false;
    cancelAnimationFrame(raf);
    heart.classList.remove('holding');
    ring.style.background = 'conic-gradient(var(--gold) 0%, rgba(255,255,255,.08) 0%)';
    status.innerHTML = `നീ വിട്ടു! വീണ്ടും — <span class="num">${lvl.durationMs/1000}s</span> പിടിക്കൂ`;
    const fb = document.getElementById('fb');
    if (fb){ fb.textContent = 'ഇത്തവണ വിടല്ലേ. ❤️'; fb.className='feedback error'; }
    sndWrong();
  }
  heart.addEventListener('pointerdown', startHold);
  heart.addEventListener('pointerup', endHold);
  heart.addEventListener('pointercancel', endHold);
  heart.addEventListener('pointerleave', endHold);
}

// ═══ LEVEL: SCRATCH AND REVEAL ═══════════════════════════════════════════
function renderScratch(lvl){
  game.innerHTML = levelShell(lvl, `
    <div class="prompt">${escapeHtml(lvl.prompt)}</div>
    <div class="scratch-stage" id="scratchStage">
      <img class="scratch-photo" id="scratchPhoto" src="${escapeHtml(lvl.revealPhoto || CONFIG.photos.funny || CONFIG.photos.wedding)}" alt="surprise reveal" onerror="this.style.background='linear-gradient(135deg,#ff6fa3,#ffd86b)';this.style.display='block';this.removeAttribute('src')">
      <div class="scratch-overlay-text" id="scratchText" style="opacity:0">${escapeHtml(lvl.revealText || '')}</div>
      <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
      <div class="scratch-prompt-overlay" id="scratchHint">✨ വിരൽ കൊണ്ട് ഫോട്ടോ ചുരണ്ടൂ</div>
    </div>
    <div class="feedback" id="fb">താഴെ എന്താണെന്നു കാണാൻ ഫോട്ടോ ചുരണ്ടൂ.</div>
    <div class="actions">
      ${(lvl.hints && state.hintIdx < lvl.hints.length) ? `<button class="btn btn-ghost" id="hint">സൂചന</button>` : ''}
    </div>
  `);
  bindHint(); bindAskHeart();

  const canvas = document.getElementById('scratchCanvas');
  const stage = document.getElementById('scratchStage');
  const text  = document.getElementById('scratchText');
  const ctx = canvas.getContext('2d');

  // Load the FRONT cover image (Together.jpeg) — gets scratched off
  const coverImg = new Image();
  coverImg.crossOrigin = 'anonymous';
  let coverLoaded = false;
  function setupCanvas(){
    const r = stage.getBoundingClientRect();
    canvas.width = r.width;
    canvas.height = r.height;
    if (coverLoaded){
      // Draw the cover photo to fill the canvas (cover-style scaling)
      const iw = coverImg.naturalWidth, ih = coverImg.naturalHeight;
      const cAspect = r.width / r.height, iAspect = iw / ih;
      let dw, dh, dx, dy;
      if (iAspect > cAspect){
        dh = r.height; dw = ih ? dh * iAspect : r.width;
        dx = (r.width - dw) / 2; dy = 0;
      } else {
        dw = r.width; dh = iw ? dw / iAspect : r.height;
        dx = 0; dy = (r.height - dh) / 2;
      }
      ctx.drawImage(coverImg, dx, dy, dw, dh);
      // Subtle "scratch here" hint on top of the cover photo
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0, r.height/2 - 26, r.width, 52);
      ctx.fillStyle = 'rgba(255,255,255,.95)';
      ctx.font = 'bold 18px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✨ ചുരണ്ടൂ ✨', r.width/2, r.height/2 - 4);
      ctx.font = '13px Outfit, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText('ദുബായിയിൽ നിന്ന് സർപ്രൈസ്', r.width/2, r.height/2 + 16);
    } else {
      // Fallback silver gradient if cover image hasn't loaded yet
      const grad = ctx.createLinearGradient(0,0,r.width,r.height);
      grad.addColorStop(0, '#9aa0b3');
      grad.addColorStop(0.5,'#d8dde8');
      grad.addColorStop(1, '#7a8093');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,r.width,r.height);
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = 'bold 18px Outfit, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ഇവിടെ ചുരണ്ടൂ', r.width/2, r.height/2);
    }
    ctx.globalCompositeOperation = 'destination-out';
  }
  coverImg.onload = () => { coverLoaded = true; setupCanvas(); };
  coverImg.onerror = () => { coverLoaded = false; setupCanvas(); };
  coverImg.src = lvl.coverPhoto || CONFIG.photos.together || 'Together.jpeg';
  setupCanvas(); // initial draw with fallback while image loads
  window.addEventListener('resize', setupCanvas);

  let scratching = false;
  function getPos(e){
    const r = canvas.getBoundingClientRect();
    const pt = e.touches ? e.touches[0] : e;
    return { x: pt.clientX - r.left, y: pt.clientY - r.top };
  }
  function scratchAt(x,y){
    ctx.beginPath();
    ctx.arc(x, y, 28, 0, Math.PI*2);
    ctx.fill();
  }
  function checkReveal(){
    // Sample 1000 random pixels for transparency
    const r = canvas.getBoundingClientRect();
    const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
    let cleared = 0, total = 0;
    for (let i = 3; i < data.length; i += 4 * 30){
      total++;
      if (data[i] < 50) cleared++;
    }
    return cleared / total;
  }
  let revealed = false;
  function maybeFinish(){
    if (revealed) return;
    if (checkReveal() > 0.55){
      revealed = true;
      // Fade remaining overlay
      canvas.animate([{opacity:1},{opacity:0}], { duration: 700, fill: 'forwards' }).onfinish = () => {
        canvas.style.opacity = '0';
        text.style.opacity = '1';
        text.style.transition = 'opacity .8s';
        document.getElementById('scratchHint').style.display = 'none';
        setTimeout(() => correct({ ...lvl, _customReward: true }), 1500);
      };
    }
  }
  function down(e){ scratching = true; e.preventDefault(); document.getElementById('scratchHint').style.opacity = '0'; sndTick(); const p = getPos(e); scratchAt(p.x, p.y); }
  function move(e){ if (!scratching) return; e.preventDefault(); const p = getPos(e); scratchAt(p.x, p.y); maybeFinish(); }
  function up(){ scratching = false; maybeFinish(); }

  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('touchstart', down, {passive:false});
  canvas.addEventListener('touchmove',  move, {passive:false});
  canvas.addEventListener('touchend',   up);
}
